# Fixture: a service that is up and passes its healthcheck.
# Typed restart should verify as "passed" within a few seconds.
services:
  web:
    image: nginx:1.27-alpine
    container_name: fixture-healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
