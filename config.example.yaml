# Planet Express topology config.
#
# Copy this file to /etc/planetexpress/config.yaml (or set CASA_CONFIG to point
# somewhere else) and edit the values below for your own environment. Secrets
# (Telegram bot token, LLM API keys) do NOT go here — they live in
# /etc/planetexpress.env, loaded as systemd environment variables. This file is
# topology only: what stacks/mounts/containers exist and how to treat them.

# Absolute path to the directory containing your stacks, one subdirectory per
# stack with its own docker-compose.yml (e.g. <stacks_root>/media/docker-compose.yml).
stacks_root: /home/youruser/stacks

# Stack directory names Planet Express must never start, monitor, auto-update,
# or auto-prune around. Leave empty if you don't have any.
forbidden_stacks: []

# Container names that are intentionally stopped right now (maintenance, a
# pending decision, etc.) — Planet Express won't flag these as "not running."
paused_containers: []

# systemd mount-unit name -> the path it mounts. Only the mounts you want Planet
# Express to actively verify (e.g. NAS shares your stacks depend on) — not
# necessarily every mount on the host.
mounts: {}

# Borg backup jobs Planet Express monitors. Drop one you've disabled on purpose, or it keeps
# warning that the job is overdue.
# backup_jobs: [daily, weekly]

# (stack, service) pairs to exclude from Zoidberg's canary auto-update pass —
# typically your own actively-developed images that shouldn't be silently
# auto-pulled and restarted.
exclude_services: []
# Example:
# exclude_services:
#   - stack: services
#     service: my-custom-app

# Sudo actions Bender is allowed to run, enforced in code (casa_bender.py's
# _safety_check()) independent of whatever a plan's LLM-generated commands claim to
# need -- a plan proposing sudo for anything not declared here is rejected outright,
# before it ever reaches the shell. Empty by default: a fresh install grants NO sudo
# actions until you explicitly declare them here AND grant them at the OS level (see
# INSTALL docs / the setup wizard) -- these two must match, declaring one without the
# other either does nothing (no OS grant) or leaves an OS grant this allowlist never
# uses (harmless, but pointless).
sudo_allowlist:
  units: []
  # Example: allow this project's own boot-time restart unit, matching a systemd
  # NOPASSWD sudoers.d grant for exactly this unit and these actions.
  # units:
  #   - unit: my-planetexpress-boot.service
  #     actions: [start, stop, restart]
  globs: []
  # Example: allow starting/stopping (not restarting) any *.mount unit -- useful if
  # Bender needs to remediate a stuck NAS/network mount as part of a plan.
  # globs:
  #   - glob: "*.mount"
  #     actions: [start, stop]

# Autonomy policy: only R0 reads are automatic; mutations require approval.
# Limits apply to automation, never operator requests.
# autonomy:
#   direct_request_risks: [R1]
#   forbidden_risks: [R4]
#   cooldown_seconds: 1800
#   max_attempts_per_day: 3

# Launch links (v2.2). The dashboard builds these from the Traefik routes it already
# reads, so most services need nothing here. This list is for the ones whose route
# cannot be turned into a URL honestly.
#
# A link is derived only from a rule that is Host() terms joined by `||` and nothing
# else -- so a route like `Host(a) && PathPrefix(/api)` gets no button, because a
# "launch" button onto a JSON endpoint is worse than no button. The case that needs a
# line here is the opposite one: a rule whose host root IS reachable but whose shape
# is too complex to read, e.g. `(Host(a) || Host(b)) && !(PathPrefix(/media) || ...)`.
#
# `name` is the CONTAINER name, exactly as the dashboard shows it (CASA_ADVLOG_FRONTEND,
# not "adventurelog"). Derived links are keyed by container, because that is what a route
# is joined to -- a Traefik service name matches a compose service for only a minority of
# this host's routes, and compose service names are not unique across projects. A declared
# link replaces whatever was derived for that container.
#
# href must be http:// or https://. zone is `lan` (default) or `public`; the LAN link
# is the one the dashboard offers first.
links: []
# links:
#   - name: CASA_ADVLOG_FRONTEND    # rule too complex to read a URL out of
#     href: https://travel.casalan.com
#     zone: lan
#   - name: CASA_PLEX               # host-networked: Traefik routes it to the host's own
#     href: https://plex.casalan.com  # address, which identifies no container
#     zone: lan
