# Planet Express topology config.
#
# Copy this file to /etc/planetexpress/config.yaml (or set CASA_CONFIG to point
# somewhere else) and edit the values below for your own environment. Secrets
# (Telegram bot token, LLM API keys) do NOT go here — they live in
# /etc/planetexpress.env, loaded as systemd environment variables. This file is
# topology only: what stacks/mounts/containers exist and how to treat them.

# Absolute path to the directory containing your stacks, one subdirectory per
# stack with its own docker-compose.yml (e.g. <stacks_root>/media/docker-compose.yml).
stacks_root: /home/youruser/stacks

# Stack directory names Planet Express must never start, monitor, auto-update,
# or auto-prune around. Leave empty if you don't have any.
forbidden_stacks: []

# Container names that are intentionally stopped right now (maintenance, a
# pending decision, etc.) — Planet Express won't flag these as "not running."
paused_containers: []

# systemd mount-unit name -> the path it mounts. Only the mounts you want Planet
# Express to actively verify (e.g. NAS shares your stacks depend on) — not
# necessarily every mount on the host.
mounts: {}

# Borg backup jobs Planet Express monitors. Drop one you've disabled on purpose, or it keeps
# warning that the job is overdue.
# backup_jobs: [daily, weekly]

# (stack, service) pairs to exclude from Zoidberg's canary auto-update pass —
# typically your own actively-developed images that shouldn't be silently
# auto-pulled and restarted.
#
# An image with no tag at all (`image: redis`) is `:latest` to Docker, and Zoidberg updates it like any other
# `:latest` image. Exclude the ones a rollback cannot protect: a database ENGINE whose on-disk format changes
# when it upgrades (Elasticsearch, a Postgres major version, ...) can start fine on the new image and then be
# unreadable by the old one, so rolling back to the old image does not bring it back.
exclude_services: []
# Example:
# exclude_services:
#   - stack: services
#     service: my-custom-app
#   - stack: media          # Elasticsearch rewrites its data on upgrade; update it by hand, with a snapshot
#     service: archivist-es

# Sudo actions Bender is allowed to run, enforced in code (casa_bender.py's
# _safety_check()) independent of whatever a plan's LLM-generated commands claim to
# need -- a plan proposing sudo for anything not declared here is rejected outright,
# before it ever reaches the shell. Empty by default: a fresh install grants NO sudo
# actions until you explicitly declare them here AND grant them at the OS level (see
# INSTALL docs / the setup wizard) -- these two must match, declaring one without the
# other either does nothing (no OS grant) or leaves an OS grant this allowlist never
# uses (harmless, but pointless).
sudo_allowlist:
  units: []
  # Example: allow this project's own boot-time restart unit, matching a systemd
  # NOPASSWD sudoers.d grant for exactly this unit and these actions.
  # units:
  #   - unit: my-planetexpress-boot.service
  #     actions: [start, stop, restart]
  globs: []
  # Example: allow starting/stopping (not restarting) any *.mount unit -- useful if
  # Bender needs to remediate a stuck NAS/network mount as part of a plan.
  # globs:
  #   - glob: "*.mount"
  #     actions: [start, stop]

# Which command family sudo_allowlist's grants above are rendered/checked against.
# "systemd" -> `sudo systemctl <action> <unit>` (the default; every install predating
# this field ran on systemd). "mos" -> `sudo service <unit> <action>` for a
# Devuan/sysvinit MOS host -- note the unit and action swap position, it isn't just a
# renamed command. Must match whichever HostControlProvider this install actually
# runs on; see docs/designs/mos-sudo-gate-scoping.md.
host_control_provider: systemd

# Autonomy policy: only R0 reads are automatic; mutations require approval.
# Limits apply to automation, never operator requests.
# autonomy:
#   # What an operator may set running without an approval card. Leave the whole block out and
#   # the defaults apply: Telegram R1, and the dashboard R1-R3 -- the dashboard reaches further
#   # because everything above R1 there asks for the operator's passphrase again first (T47),
#   # which is a thing a browser can prove and a chat message cannot.
#   #
#   # `direct_request_risks` governs the surfaces that have no default of their own, which
#   # today means Telegram. To change what the DASHBOARD may reach -- in either direction --
#   # say so under direct_request_risks_by_origin: that is visible in a config diff, which is
#   # what makes it lockable and what makes changing it need the passphrase.
#   direct_request_risks: [R1]
#   direct_request_risks_by_origin:
#     dashboard-direct: [R1, R2, R3]
#     telegram-direct: [R1]
#   forbidden_risks: [R4]
#   cooldown_seconds: 1800
#   max_attempts_per_day: 3

# Launch links (v2.2). The dashboard builds these from the Traefik routes it already
# reads, so most services need nothing here. This list is for the ones whose route
# cannot be turned into a URL honestly.
#
# A link is derived only from a rule that is Host() terms joined by `||` and nothing
# else -- so a route like `Host(a) && PathPrefix(/api)` gets no button, because a
# "launch" button onto a JSON endpoint is worse than no button. The case that needs a
# line here is the opposite one: a rule whose host root IS reachable but whose shape
# is too complex to read, e.g. `(Host(a) || Host(b)) && !(PathPrefix(/media) || ...)`.
#
# A derived link reaches its container through the docker router that container's
# labels declare, so a route from Traefik's file provider -- another machine, or a
# network_mode: host service like jellyfin -- never gets one and needs a line here too.
#
# name is the container name, as `docker ps` shows it -- not the compose service name,
# which is not unique across stacks. A declared link replaces whatever was derived for
# that container. href must be http:// or https://. zone is `lan` (default) or
# `public`; the LAN link is the one the dashboard offers first.
links: []
# links:
#   - name: CASA_ADVENTURELOG
#     href: https://travel.casalan.com
#     zone: lan
#   - name: CASA_JELLYFIN           # network_mode: host
#     href: https://jellyfin.casalan.com

# Other hosts (docs/designs/multi-host.md; INSTALL.md "Other hosts over SSH"). The hosts besides this one that PE
# should show. Empty -- the default -- turns the feature off.
#
# This list is config rather than discovery on purpose: a host known only from a collector's answer has no name, no link
# and no row the moment it cannot be read, so it silently vanishes just when something is wrong.
#
# A host with an `ssh:` alias (a Host in Core's ~/.ssh/config, key-based, its host key already in known_hosts) is read by
# Core every minute: its containers (state, health, restarts, published ports, traefik and compose labels; never their
# env) and its CPU, memory, disk and load. Only three fixed read commands are ever sent, and PE never changes another
# host. Their problems are reported and recorded as incidents, never planned. An alias that reaches this host's own
# Docker engine is refused. A host without `ssh` is shown with its link only. `system_id` and `local_system_id` (the
# Beszel collector, removed) are still accepted and ignored.
multi_host:
  hosts: []
# multi_host:
#   hosts:
#     - name: CASALAB
#       ssh: casalab
#       link: https://casalab.casalan.com
#     - name: CASA SOLAR ASSISTANT        # SSH and no Docker: metrics only
#       ssh: solar
#       docker: false
#       link: http://192.168.1.154

# v4 mission control (off by default). With it on, the dashboard gains Missions and Memory pages and
# Telegram gains /missions, /mission <id> and /cancel_mission <id>. Observe and Propose missions investigate
# and propose; Repair missions change the host only inside a grant you approve. Before turning it on read
# INSTALL.md "Mission control": the host setup (launcher steps) must be applied first, and the values below
# must match what setup wrote into launch.conf.
# Core reads missions.enabled once, at startup: after changing it, restart core (the dashboard follows
# config reloads on its own, so it can show the pages before core will answer them).
# missions:
#   enabled: true
#   runtime:
#     argv: ["/usr/local/bin/claude", "-p", "Read BRIEF.md in the current directory and carry out the mission it describes."]   # an absolute command; no agent is bundled (with missions.hooks.install_claude_code it must be the claude binary itself)
#   model_broker:                   # lets the agent reach the model without ever holding the API key (see INSTALL.md "The model broker")
#     enabled: true
#     key_env: ANTHROPIC_API_KEY    # the NAME of the variable in Core's environment (/etc/planetexpress.env) that holds the real key
#                                   # (an API key, never a subscription login). For OpenRouter also set upstream_host: openrouter.ai,
#                                   # upstream_path_prefix: /api, auth_scheme: bearer and session_env (see INSTALL.md)
#     models: ["claude-sonnet-4-5"] # the only model ids a mission may request
#     core_max_requests_per_day: 1000     # PE's own calls (Hermes, Farnsworth, Amy, Fry) go through the broker whenever it runs;
#     core_max_tokens_per_day: 5000000    #   these are their daily budget (UTC), not a mission session's
#     usage:                        # credit and spend from the provider, in the Console and on Missions; nothing stops on it
#       poll_s: 300                 # OpenRouter: read with the same key; Anthropic: only with admin_key_env (an Admin API key)
#       warn_below: 10.0            # USD of credit left: amber and one Telegram alert
#       low_below: 2.0              # USD: red and a second alert
#       admin_key_env: ""           # Anthropic direct: the NAME of the variable holding an sk-ant-admin key (read-only cost report)
#   hooks:                          # required by the Console: PE's settings must be the only ones the agent reads
#     install_claude_code: true
#     command: ["/usr/bin/python3"]  # the interpreter; Core copies the hook into each session's hook dir at every launch
#     root: /var/lib/planetexpress/mission-hooks
#   console:                        # the Operator Console (off by default): conversations with a PE-aware agent. Needs model_broker and hooks above
#     enabled: false
#     claude: /usr/local/bin/claude       # the claude CLI itself, never a wrapper
#     model: claude-sonnet-4-5            # must be one of missions.model_broker.models above (OpenRouter: the alias you listed there)
#     token_budget: 500000                # a usage mark per conversation, shown on the page; nothing stops at it (the broker's own limits are the backstop)
#     max_open: 10                        # open conversations; each keeps one session uid for its whole life
#     archive_after_days: 3               # an idle conversation is archived: its state directory is emptied and its uid freed
#   session_uid_min: 200000         # one uid, private group and pe-s<N> account per session; not Core's uid, not systemd DynamicUser's 61184-65519
#   session_uid_max: 200063
#   session_groups: [docker, pe-session, adm, systemd-journal]   # every session's groups: the real Docker socket, sudo, the logs
#   sock_root: /run/planetexpress-sessions
#   cgroup_root: /sys/fs/cgroup/system.slice/casa-planetexpress.service/sessions   # MOS: the tree launcher-boot.sh makes
#   workspace_root: /var/lib/planetexpress/mission-workspaces
#   launch_conf: /etc/planetexpress-launch/launch.conf   # MOS: under PE_HOME on the data pool
#   verify:
#     exec_allowlist: []            # binaries a verification exec_probe may run inside a container; empty: unavailable
#   checkpoint:
#     root: /var/lib/planetexpress/checkpoints   # unset: `checkpoints` next to the state database
#   # Removed by trust mode and ignored if still present: checkpoint.backup_sources, protected, protected_overrides,
#   # protected_absent, live_trees, cross_host, package_paths, docker_socket, docker_label_allow, docker_proxy_ports,
#   # worker_sudo_rules, worker_sudo_all_sessions (and the tripwire_* keys).
#   tool_sites: {}                  # brokered tools: {dns.rewrite: {primary: "http://adguard.lan:3000"}}
#   tool_secret_env: {}             # secret ref -> the NAME of a Core environment variable holding the key
